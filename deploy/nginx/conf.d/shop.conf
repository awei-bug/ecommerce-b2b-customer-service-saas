# 无域名站点配置（HTTP，IP 访问）
#
# 适用：一台 VPS / 小主机，没有域名、没有证书时，用 http://<服务器IP> 直接访问。
# 挂载关系（docker-compose.yml 已定义）：
#   /var/www/admin      <- vue_shop/dist（构建时 publicPath=/admin/）
#   /var/www/mall       <- mall/dist
#   /var/www/uploads    <- shop_uploads 卷（与 api 容器共享上传目录）
#   /etc/nginx/certs    <- TLS 证书目录（本配置不用，升级 HTTPS 时用）
#
# 升级到域名 + HTTPS 时：取消下方注释掉的 443 server 块，并把本块的
# server_name _ 改为你的域名。

server {
    listen 80;
    server_name _;  # 接受任意 Host（IP 访问）

    client_max_body_size 20m;

    # ---- 商家后台：vue_shop dist ----
    location /admin/ {
        alias /var/www/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- 商城前台：mall dist ----
    location / {
        root /var/www/mall;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- 上传文件：由 nginx 直接服务（与 api 共享 shop_uploads 卷）----
    location /static/upload/ {
        alias /var/www/uploads/;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---- API 反向代理：商家端 + 顾客端 + 健康检查 ----
    location ~ ^/(user|products|product|orders|order|pay|menu|roles|role|permissions|categorys|attributes|attribute|cate_grup|freight|expresses|dashboard|upload_img|health|api) {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- compose 里 nginx 的 healthcheck 打这个路径 ----
    location = /healthz {
        proxy_pass http://api:5000/health/;
        proxy_set_header Host $host;
    }
}

