# HTTP：证书就绪前用此文件；有证书后可改用 default.ssl.conf 并删掉本文件监听冲突
# 健康检查
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # API
    location /api/ {
        # 当前后端路由多数无 /api 前缀；C 端与平台有 /api/c /api/p
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health/ {
        proxy_pass http://api:5000/health/;
        proxy_set_header Host $host;
    }

    # 直透后端业务路径（商户后台 axios 默认打这些）
    location ~ ^/(user|menu|roles|role|categorys|attributes|attribute|products|product|orders|order|pay|expresses|freight|permissions|upload_img|cate_grup|dashboard|payments|shipments|shipment)/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 上传静态（禁止脚本执行）
    location /static/upload/ {
        alias /var/www/uploads/;
        expires 7d;
        access_log off;
        types { }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff;
        # 禁止把上传目录当 PHP/脚本执行（静态 alias 下本身不执行，显式注释意图）
    }

    # 商户后台（vue_shop build → dist）
    location /admin/ {
        alias /var/www/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # C 端商城（mall build → dist）放在根路径
    location / {
        root /var/www/mall;
        try_files $uri $uri/ /index.html;
    }
}
