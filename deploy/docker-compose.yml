# 在仓库根目录执行：
#   cp deploy/.env.prod.example deploy/.env.prod   # 再编辑
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.prod up -d --build

name: flask-shop

services:
  mysql:
    image: mysql:8.0
    container_name: shop_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: ${MYSQL_DB:-flask_shop_saas}
      MYSQL_USER: ${MYSQL_USERNAME:-shop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-db-password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - shop_mysql_data:/var/lib/mysql
      - shop_backups:/data/backups
    ports:
      # 生产建议去掉端口映射，仅容器网互通
      - "${MYSQL_PUBLISH_PORT:-127.0.0.1:3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: shop_api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      FLASK_CONFIG: product
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      ALLOW_MOCK_PAY: ${ALLOW_MOCK_PAY:-0}
      PAY_DEFAULT_CHANNEL: ${PAY_DEFAULT_CHANNEL:-mock}
      SMS_DEV_MODE: ${SMS_DEV_MODE:-0}
    volumes:
      - shop_uploads:/app/flask_shop/static/upload
      - shop_backups:/data/backups
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: shop_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Windows 上 80/8080 常被占用，默认 18080
      - "${HTTP_PUBLISH_PORT:-18080}:80"
      - "${HTTPS_PUBLISH_PORT:-18443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - shop_uploads:/var/www/uploads:ro
      # 前端构建产物（可选）：先 npm run build 再挂载
      - ../vue_shop/dist:/var/www/admin:ro
      - ../mall/dist:/var/www/mall:ro
      # TLS 证书目录（Let's Encrypt 或自备）
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  shop_mysql_data:
  shop_uploads:
  shop_backups:
