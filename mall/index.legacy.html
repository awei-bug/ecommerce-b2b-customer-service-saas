<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>演示商城 · C端骨架</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #fff;
      --text: #1f2329;
      --muted: #8a8f99;
      --primary: #1677ff;
      --danger: #ff4d4f;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 72px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(135deg, #1677ff, #69b1ff);
      color: #fff;
      padding: 16px 16px 14px;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header .sub { margin-top: 4px; font-size: 12px; opacity: .9; }
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid #eef0f4;
    }
    .toolbar input, .toolbar select {
      flex: 1;
      border: 1px solid #e5e6eb;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
    }
    .toolbar button {
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
    }
    .list { padding: 12px 16px; display: grid; gap: 12px; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      display: grid;
      gap: 8px;
    }
    .card .name { font-size: 16px; font-weight: 600; }
    .card .meta { color: var(--muted); font-size: 13px; }
    .card .price { color: var(--danger); font-size: 18px; font-weight: 700; }
    .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card button {
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
    }
    .card button.ghost {
      background: #eef5ff;
      color: var(--primary);
    }
    .tabs {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #fff;
      border-top: 1px solid #eef0f4;
    }
    .tabs button {
      border: none;
      background: #fff;
      padding: 12px;
      font-size: 14px;
      color: var(--muted);
    }
    .tabs button.active { color: var(--primary); font-weight: 600; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 16px;
      font-size: 14px;
    }
    .toast {
      position: fixed;
      left: 50%;
      top: 20%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.78);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 99;
      display: none;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f0f5ff;
      color: #2f54eb;
      font-size: 12px;
    }
    .tag.paid { background: #f6ffed; color: #52c41a; }
    .tag.pending { background: #fff7e6; color: #fa8c16; }
    .tag.closed { background: #f5f5f5; color: #8c8c8c; }
    .muted { color: var(--muted); font-size: 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1 id="shopName">演示商城</h1>
      <div class="sub">C 端骨架 · 模拟支付 · 多租户</div>
    </header>

    <div class="toolbar">
      <select id="tenantSlug">
        <option value="demo-a">demo-a 店铺A</option>
        <option value="demo-b">demo-b 店铺B</option>
      </select>
      <input id="customerName" value="小明" placeholder="买家昵称" />
      <button id="btnReload">刷新</button>
    </div>

    <section id="viewProducts" class="list"></section>
    <section id="viewOrders" class="list" style="display:none"></section>

    <nav class="tabs">
      <button id="tabProducts" class="active">商品</button>
      <button id="tabOrders">我的订单</button>
    </nav>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const API = 'http://127.0.0.1:5000/api/c';

    const els = {
      shopName: document.getElementById('shopName'),
      tenantSlug: document.getElementById('tenantSlug'),
      customerName: document.getElementById('customerName'),
      products: document.getElementById('viewProducts'),
      orders: document.getElementById('viewOrders'),
      tabProducts: document.getElementById('tabProducts'),
      tabOrders: document.getElementById('tabOrders'),
      toast: document.getElementById('toast'),
      btnReload: document.getElementById('btnReload'),
    };

    function toast(msg) {
      els.toast.textContent = msg;
      els.toast.style.display = 'block';
      setTimeout(() => { els.toast.style.display = 'none'; }, 1800);
    }

    function headers() {
      return {
        'Content-Type': 'application/json',
        'X-Tenant-Slug': els.tenantSlug.value,
        'X-Customer-Name': els.customerName.value || 'guest',
      };
    }

    async function api(path, options = {}) {
      const res = await fetch(API + path, {
        ...options,
        headers: { ...headers(), ...(options.headers || {}) },
      });
      const data = await res.json().catch(() => ({}));
      return data;
    }

    async function loadShop() {
      const data = await api('/shop/');
      if (data.status === 200) {
        els.shopName.textContent = data.data.name || '演示商城';
      } else {
        els.shopName.textContent = '租户无效';
        toast(data.msg || '加载店铺失败');
      }
    }

    async function loadProducts() {
      const data = await api('/products/');
      if (data.status !== 200) {
        els.products.innerHTML = `<div class="empty">${data.msg || '加载失败'}</div>`;
        return;
      }
      const list = data.data || [];
      if (!list.length) {
        els.products.innerHTML = '<div class="empty">暂无商品</div>';
        return;
      }
      els.products.innerHTML = list.map(p => `
        <div class="card">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="meta">${escapeHtml(p.introduce || '暂无简介')}</div>
          <div class="row">
            <div class="price">￥${Number(p.price).toFixed(2)}</div>
            <div class="muted">库存 ${p.number ?? 0}</div>
          </div>
          <div class="row">
            <button class="ghost" onclick="buy(${p.id}, 1)">立即购买</button>
          </div>
        </div>
      `).join('');
    }

    async function loadOrders() {
      const data = await api('/orders/');
      if (data.status !== 200) {
        els.orders.innerHTML = `<div class="empty">${data.msg || '加载失败'}</div>`;
        return;
      }
      const list = data.data || [];
      if (!list.length) {
        els.orders.innerHTML = '<div class="empty">暂无订单，去商品页下单吧</div>';
        return;
      }
      els.orders.innerHTML = list.map(o => {
        const tagClass = o.status === 'paid' || o.status === 'completed' || o.status === 'shipped'
          ? 'paid'
          : (o.status === 'pending_pay' ? 'pending' : 'closed');
        const payBtn = o.status === 'pending_pay'
          ? `<button onclick="payOrder(${o.id})">去支付</button>`
          : '';
        return `
          <div class="card">
            <div class="row">
              <div class="name">${escapeHtml(o.order_no || ('#' + o.id))}</div>
              <span class="tag ${tagClass}">${escapeHtml(o.status_label || o.status)}</span>
            </div>
            <div class="meta">${escapeHtml(o.address || '')}</div>
            <div class="row">
              <div class="price">￥${Number(o.price).toFixed(2)}</div>
              <div class="actions">${payBtn}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function buy(pid, number) {
      const address = prompt('收货地址', '上海市演示路 1 号') || '';
      if (!address) return;
      const data = await api('/orders/', {
        method: 'POST',
        body: JSON.stringify({
          address,
          items: [{ pid, number }],
        }),
      });
      if (data.status !== 200) {
        toast(data.msg || '下单失败');
        return;
      }
      toast('下单成功，可去支付');
      showOrders();
      await loadOrders();
      // 可选：自动拉起支付
      if (confirm('下单成功，是否立即模拟支付？')) {
        await payOrder(data.data.id);
      }
    }

    async function payOrder(orderId) {
      const create = await api('/pay/create/', {
        method: 'POST',
        body: JSON.stringify({ order_id: orderId, channel: 'mock' }),
      });
      if (create.status !== 200) {
        toast(create.msg || '创建支付单失败');
        return;
      }
      const outTradeNo = create.data.payment.out_trade_no;
      const pay = await api('/pay/mock/', {
        method: 'POST',
        body: JSON.stringify({ out_trade_no: outTradeNo }),
      });
      if (pay.status === 200) {
        toast(pay.msg || '支付成功');
        await loadOrders();
        await loadProducts();
      } else {
        toast(pay.msg || '支付失败');
      }
    }

    function escapeHtml(s) {
      return String(s ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    function showProducts() {
      els.viewProducts.style.display = 'grid';
      els.viewOrders.style.display = 'none';
      els.tabProducts.classList.add('active');
      els.tabOrders.classList.remove('active');
    }
    function showOrders() {
      els.viewProducts.style.display = 'none';
      els.viewOrders.style.display = 'grid';
      els.tabOrders.classList.add('active');
      els.tabProducts.classList.remove('active');
    }

    // expose for inline handlers
    window.buy = buy;
    window.payOrder = payOrder;

    async function reloadAll() {
      await loadShop();
      await loadProducts();
      await loadOrders();
    }

    els.tabProducts.onclick = () => { showProducts(); loadProducts(); };
    els.tabOrders.onclick = () => { showOrders(); loadOrders(); };
    els.btnReload.onclick = reloadAll;
    els.tenantSlug.onchange = reloadAll;

    reloadAll();
  </script>
</body>
</html>
